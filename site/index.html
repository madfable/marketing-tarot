<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marketing Tarot</title>
  <meta name="description" content="Pick a marketing question, pull four cards, and get a reading written for small wellness businesses.">
  <meta name="robots" content="noindex">
  <!-- The same three families merlinitemarketing.com loads; the widget is its own document
       inside the iframe, so it has to load them itself. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600&family=Caveat:wght@500;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="marketing-tarot"></div>

  <script>
    // Site-specific settings. Everything else lives in deck.js (the copy), app.js (the
    // widget) and pdf.js (the download).
    window.MARKETING_TAROT_CONFIG = {
      servicesUrl: "https://merlinitemarketing.com/services",
      // Folder that holds the 78 card images, named like the-fool.jpg, ace-of-wands.jpg.
      cardsBaseUrl: "cards/",
      imageExt: ".jpg"
    };
  </script>
  <script src="deck.js"></script>
  <script src="pdf.js"></script>
  <script src="app.js"></script>
</body>
</html>
