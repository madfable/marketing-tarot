<!--
  Marketing Tarot: iframe embed for Squarespace.
  1. The site/ folder is published by GitHub Pages at https://madfable.github.io/marketing-tarot/
  2. The Marketing Tarot landing page on merlinitemarketing.com is one big Code Block of
     Kelly's. Edit that block, find the placeholder near the bottom of the teal "reading"
     section (a div with class "slot", containing the note "MIKE: put the tarot generator
     embed here" and the text "[Mike's tarot generator goes here]"), and replace that whole
     div, from its opening tag to its closing tag, with everything below this comment.
     On any other page, paste it into a Code Block (HTML) of its own.
  3. The src below already points at the GitHub Pages site for this repo.
  The widget's colours match the teal arch it sits in, so the frame itself is invisible, and
  it leaves out its own title because the page already has the heading above it.
  The widget tells the page how tall it is, so the iframe grows and shrinks with the reading,
  and it mirrors the reading into this page's URL (#q=…&c=…) so a copied link brings it back.
  If this script doesn't run (Squarespace 7.0 "Ajax loading", or only the iframe was pasted),
  the frame keeps its own scrollbar so the whole reading is still reachable.
-->
<iframe
  id="marketing-tarot-frame"
  src="https://madfable.github.io/marketing-tarot/"
  title="Marketing Tarot"
  style="display:block;width:100%;border:0;min-height:160px;"
></iframe>
<script>
  (function () {
    var frame = document.getElementById("marketing-tarot-frame");
    if (!frame) return;
    var origin, base = frame.src.split("#")[0], shown = "", acked = false;
    try { origin = new URL(base).origin; } catch (e) { return; }
    var isReading = function (h) { return /^#q=\d+&c=[\d,]+$/.test(h); };

    // If this page was opened with a reading in its URL, hand it to the widget. Also runs
    // when the hash changes later (a shared link to this same page).
    var seed = function () {
      var h = window.location.hash;
      if (isReading(h) && h !== shown) { shown = h; frame.src = base + h; }
    };
    seed();
    window.addEventListener("hashchange", seed);

    window.addEventListener("message", function (event) {
      if (event.origin !== origin || event.source !== frame.contentWindow) return;
      var data = event.data || {};
      if (data.type === "marketing-tarot:height" && data.height > 0) {
        frame.style.height = Math.ceil(data.height) + "px";
        // Tell the widget its height messages are being honoured, so it can drop its scrollbar.
        if (!acked) { acked = true; event.source.postMessage({ type: "marketing-tarot:ack" }, origin); }
      }
      if (data.type === "marketing-tarot:reading" && isReading(data.hash) && window.history.replaceState) {
        shown = data.hash;
        try { window.history.replaceState(null, "", data.hash); } catch (e) {}
      }
    });
  })();
</script>
