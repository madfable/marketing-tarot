<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marketing Tarot widget tests</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { background: #fff; font: 14px/1.5 -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; }
    #report { padding: 16px; max-width: 900px; margin: 0 auto; }
    #summary { font-size: 18px; font-weight: 600; padding: 10px 14px; border-radius: 8px; }
    #summary.pass { background: #e3f3e6; color: #1f5a2b; }
    #summary.fail { background: #fbe3e3; color: #7a1f1f; }
    #summary.running { background: #eee; }
    #results { list-style: none; padding: 0; }
    #results li { padding: 6px 10px; border-bottom: 1px solid #eee; }
    #results li.pass::before { content: "ok   "; color: #2f6b3a; font-family: monospace; white-space: pre; }
    #results li.fail::before { content: "FAIL "; color: #b23a3a; font-family: monospace; white-space: pre; }
    #results li.fail pre { margin: 6px 0 0 36px; color: #7a1f1f; white-space: pre-wrap; }
    #pdf-link { margin: 12px 0; }
    /* Widget instances render here; kept visible so layout problems are noticeable. */
    #stage { border-top: 2px dashed #ccc; margin-top: 24px; opacity: 0.9; }
    #stage > div { margin-bottom: 20px; }
  </style>
</head>
<body>
  <div id="report">
    <h1>Marketing Tarot widget tests</h1>
    <p>Runs the real <code>app.js</code> and <code>pdf.js</code> against the real <code>deck.js</code> in this browser. Open from the dev server: <code>npm run dev</code>, then <code>/test/</code>.</p>
    <div id="summary" class="running">Running…</div>
    <p id="pdf-link"></p>
    <ul id="results"></ul>
  </div>
  <div id="stage"></div>

  <script src="/deck.js"></script>
  <script src="/pdf.js"></script>
  <script src="widget-tests.js"></script>
</body>
</html>
