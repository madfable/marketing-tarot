# Publishes the site/ folder to GitHub Pages on every push to main.
# One-time setup in the repo: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Deploy widget to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Regenerates site/deck.js from data/deck.json, so updating Kelly's copy is just a push.
      - run: node scripts/build-deck.mjs
      # Adds ?v=<content hash> to the asset links in index.html so a redeploy can never mix
      # a cached old app.js with a fresh styles.css (GitHub Pages caches files for 10 min).
      - run: node scripts/stamp-assets.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
